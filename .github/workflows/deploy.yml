name: CI / CD

# Promotion flow:
#   feature/* --PR--> dev    : test + evaluate
#   merge to dev             : test + evaluate + build :dev   --> auto-PR to stag
#   merge to stag            : test + evaluate + build :stag  --> auto-PR to main
#   merge to main (= prod)   : test + evaluate + build :prod  (gated by 'production' env)

on:
  push:
    branches: [main, stag, dev] # Runs pipeline when code is pushed to these branches
  pull_request:
    branches: [main, stag, dev] # Runs pipeline when PR is created targeting these branches
#You push code to dev → pipeline runs
#You open PR: dev → stag → pipeline runs
env:
  REGISTRY: ghcr.io
  # GHCR requires the repository name to be all lowercase; ${{ github.repository }}
  # preserves case (e.g. SmitTiwary/inference-pipeline). The image name is
  # lowercased once per job below and surfaced via steps.imagename.outputs.value.
  IMAGE_BASENAME: inference # Base name of your Docker image

jobs:
  # ── 1. Lint & Unit Tests ────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest # GitHub gives you a fresh Ubuntu VM
    steps:
      - uses: actions/checkout@v4 # clones your repo code into the VM

      - uses: actions/setup-python@v5 #Installs Python 3.11 + caches dependencies
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint #Checks code quality # Detects unused imports, undefined names, and other issues
        run: |
          pip install ruff   
          ruff check app/ tests/

      - name: Run tests (incl. test_eval.py — uses real BERT pulled from HF Hub)
        env:
          MODEL_PATH: ${{ vars.HF_MODEL_REPO || 'Glsmit/bert-imdb-sentiment' }}
          MODEL_VERSION: ci
          # First-run cost: ~30s to download the 426 MB model. Cached afterwards.
          HF_HOME: ${{ runner.temp }}/hf-cache
        run: pytest tests/ -v --tb=short

  # ── 2. Offline Model Evaluation ─────────────────────────────────────────────
  evaluate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run model evaluation against HF Hub model
        env:
          # evaluate.py uses OUTPUT_DIR both as the model source and the
          # results destination — passing the HF repo id makes it download
          # the model and write eval_results.json under ./<org>/<repo>/.
          OUTPUT_DIR: ${{ vars.HF_MODEL_REPO || 'Glsmit/bert-imdb-sentiment' }}
          EVAL_SAMPLES: "200"
          HF_HOME: ${{ runner.temp }}/hf-cache
        run: python -m app.evaluate

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: "**/eval_results.json"
          if-no-files-found: ignore

  # ── 3. Build & Push Docker Image to GHCR (only on push to env branches) ────
  build:
    needs: [test, evaluate]
    if: github.event_name == 'push' && contains(fromJson('["main","stag","dev"]'), github.ref_name)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # The 'production' environment can require a reviewer in the GitHub UI;
    # 'dev' and 'stag' are unprotected and run automatically.
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}
    outputs:
      image_tag: ${{ steps.envtag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve environment tag
        id: envtag
        run: |
          case "${{ github.ref_name }}" in
            main) echo "tag=prod" >> "$GITHUB_OUTPUT" ;;
            stag) echo "tag=stag" >> "$GITHUB_OUTPUT" ;;
            dev)  echo "tag=dev"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Compute lowercase image name
        id: imagename
        run: |
          NAME="$(echo '${{ github.repository }}/${{ env.IMAGE_BASENAME }}' | tr '[:upper:]' '[:lower:]')"
          echo "value=$NAME" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.imagename.outputs.value }}:${{ steps.envtag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.imagename.outputs.value }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## Built image"
            echo "- \`${{ env.REGISTRY }}/${{ steps.imagename.outputs.value }}:${{ steps.envtag.outputs.tag }}\`"
            echo "- \`${{ env.REGISTRY }}/${{ steps.imagename.outputs.value }}:sha-${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 4. Auto-promote: open PR to next env ────────────────────────────────────
  promote:
    needs: build
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'stag')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target branch
        id: target
        run: |
          case "${{ github.ref_name }}" in
            dev)  echo "branch=stag" >> "$GITHUB_OUTPUT" ;;
            stag) echo "branch=main" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Open / update promotion PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC: ${{ github.ref_name }}
          DST: ${{ steps.target.outputs.branch }}
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}/${{ env.IMAGE_BASENAME }}' | tr '[:upper:]' '[:lower:]')"
          existing=$(gh pr list --base "$DST" --head "$SRC" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh pr create \
              --base "$DST" \
              --head "$SRC" \
              --title "Promote $SRC -> $DST (sha ${GITHUB_SHA::7})" \
              --body "Automated promotion PR after green CI on \`$SRC\`.

          Image built and pushed:
          - \`${IMAGE}:${{ needs.build.outputs.image_tag }}\`
          - \`${IMAGE}:sha-${GITHUB_SHA}\`

          Merge this PR to advance to \`$DST\`."
            echo "Created PR $SRC -> $DST"
          else
            echo "PR $SRC -> $DST already exists; nothing to do."
          fi
